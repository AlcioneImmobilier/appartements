<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biens à vendre à Paris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan : pierre de Paris et zinc des toits. Mise en page : sommaire en cartes, puis une fiche pleine largeur par bien. */
:root{
  --bg:#f3f1ed; --surface:#ffffff; --ink:#1c2630; --muted:#5d6874; --line:#d9d6cf;
  --zinc:#2f4658; --zinc-soft:#e3e9ee; --brass:#9a7a3d; --todo-bg:#fff6dc; --todo-ink:#7a5a00; --todo-line:#d6a82c;
  --ph-a:#e6e3dc; --ph-b:#ddd9d0; --on-zinc:#fff;
  --font-display:"Newsreader", Georgia, "Times New Roman", serif;
  --font-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181e; --surface:#1a232b; --ink:#e9ecef; --muted:#a2adb7; --line:#2d3945;
    --zinc:#8fb0c9; --zinc-soft:#22313d; --brass:#c9a561; --todo-bg:#33290e; --todo-ink:#f0cf7a; --todo-line:#a98621;
    --ph-a:#222d36; --ph-b:#1d2730; --on-zinc:#0e151b; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181e; --surface:#1a232b; --ink:#e9ecef; --muted:#a2adb7; --line:#2d3945;
  --zinc:#8fb0c9; --zinc-soft:#22313d; --brass:#c9a561; --todo-bg:#33290e; --todo-ink:#f0cf7a; --todo-line:#a98621;
  --ph-a:#222d36; --ph-b:#1d2730; --on-zinc:#0e151b; color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;line-height:1.15;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* à compléter */
.todo{display:inline-block;padding:1px 8px;border:1.5px dashed var(--todo-line);background:var(--todo-bg);color:var(--todo-ink);border-radius:6px;font-size:.85em;font-weight:500;line-height:1.5}
.draft-banner{background:var(--todo-bg);color:var(--todo-ink);border-bottom:1.5px dashed var(--todo-line);font-size:.9rem;padding:8px 0}

/* en-tête */
.top{padding:44px 0 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.brand i{display:block;width:28px;height:2px;background:var(--brass)}
.top h1{font-size:clamp(2.1rem,6vw,3.6rem);margin:18px 0 12px;max-width:16ch}
.top p.lead{max-width:56ch;color:var(--muted);margin:0;font-size:1.05rem}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
.nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.nav a{white-space:nowrap;text-decoration:none;font-size:.88rem;font-weight:600;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.nav a:hover{border-color:var(--zinc)}

/* sommaire */
.overview{padding:32px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:0;padding:0;list-style:none}
.card{display:flex;flex-direction:column;height:100%;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--zinc)}
.card .ph{aspect-ratio:4/3;border-radius:0;border:0}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .q{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card .t{font-family:var(--font-display);font-size:1.15rem;line-height:1.2}
.card .p{margin-top:auto;padding-top:8px;font-weight:700}
.card .m{font-size:.88rem;color:var(--muted)}

/* placeholders */
.ph{position:relative;display:grid;place-items:center;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.85rem;font-weight:500;background:repeating-linear-gradient(135deg,var(--ph-a) 0 14px,var(--ph-b) 14px 28px)}
.ph span{background:var(--surface);padding:3px 10px;border-radius:99px;border:1px solid var(--line)}

/* fiche */
.bien{padding:56px 0 8px;border-top:1px solid var(--line);margin-top:48px}
.bien-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px;margin-bottom:22px}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.bien h2{font-size:clamp(1.7rem,4.4vw,2.6rem);max-width:22ch}
.where{color:var(--muted);margin-top:8px}
.price{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1}
.price small{display:block;font-family:var(--font-body);font-size:.82rem;color:var(--muted);margin-top:6px}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 26px}
.facts div{background:var(--surface);padding:14px 16px}
.facts dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.facts dd{margin:4px 0 0;font-family:var(--font-display);font-size:1.4rem}

.sec-title{font-family:var(--font-body);font-size:.8rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery button{padding:0;border:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden;display:block;width:100%}
.gallery .ph,.gallery img{aspect-ratio:4/3;width:100%;object-fit:cover;border-radius:10px}
.gallery button:first-child{grid-column:1/-1}
.gallery button:first-child .ph,.gallery button:first-child img{aspect-ratio:16/9}
@media (min-width:760px){
  .gallery{grid-template-columns:repeat(4,1fr)}
  .gallery button:first-child{grid-column:span 2;grid-row:span 2}
  .gallery button:first-child .ph,.gallery button:first-child img{aspect-ratio:auto;height:100%}
}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.plans button{padding:0;border:0;background:none;cursor:zoom-in;border-radius:10px;width:100%}
.plans .ph,.plans img{aspect-ratio:4/3;width:100%;object-fit:contain;background:#fff;border-radius:10px}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.vid{display:grid;place-items:center;aspect-ratio:16/9;border-radius:10px;text-decoration:none;color:#fff;background:linear-gradient(160deg,var(--zinc),#14202a);text-align:center;padding:16px;gap:6px}
.vid b{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid #fff;font-size:1.3rem}
.vid span{font-weight:600}
.vid:hover{filter:brightness(1.1)}

.two{display:grid;gap:28px}
@media (min-width:860px){.two{grid-template-columns:1.1fr .9fr;gap:48px}}
.desc p{margin:0 0 14px;max-width:62ch}
.hl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.hl li{padding-left:22px;position:relative}
.hl li::before{content:"";position:absolute;left:0;top:.65em;width:10px;height:2px;background:var(--brass)}
.spec{margin:0;display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.spec div{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.spec div:last-child{border-bottom:0}
.spec dt{color:var(--muted)}
.spec dd{margin:0;text-align:right;font-weight:600}

/* contact */
.contact{margin-top:34px;background:var(--zinc-soft);border:1px solid var(--line);border-radius:14px;padding:22px}
.contact h3{font-size:1.5rem;margin-bottom:6px}
.contact p.sub{margin:0 0 16px;color:var(--muted)}
.form{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.form{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}
label{display:grid;gap:5px;font-size:.85rem;font-weight:600}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:92px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:99px;border:1.5px solid var(--zinc);background:var(--zinc);color:var(--on-zinc);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.hint{font-size:.85rem;color:var(--muted);margin-top:10px}
.copied{font-size:.85rem;font-weight:600;color:var(--zinc);align-self:center}

/* mentions */
footer{margin-top:72px;border-top:1px solid var(--line);padding:32px 0 56px;color:var(--muted);font-size:.88rem}
footer h2{font-family:var(--font-body);font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink);margin-bottom:10px}
footer ul{margin:0;padding-left:18px;display:grid;gap:6px;max-width:75ch}

/* visionneuse */
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,14,18,.92);display:none;grid-template-rows:auto 1fr auto;padding:12px}
.lb.open{display:grid}
.lb-bar{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:12px}
.lb-stage{display:grid;place-items:center;min-height:0;padding:8px}
.lb-stage img{max-height:100%;max-width:100%;object-fit:contain}
.lb-stage .ph{width:min(900px,100%);aspect-ratio:3/2;font-size:1rem}
.lb-nav{display:flex;justify-content:center;gap:12px}
.lb button{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:9px 18px;cursor:pointer;font-weight:600}
.lb button:hover{background:rgba(255,255,255,.25)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>
<body>

<div class="draft-banner" id="draft" hidden><div class="wrap">Version de travail : les éléments en pointillés jaunes sont à compléter avant diffusion.</div></div>

<header class="top">
  <div class="wrap">
    <div class="brand"><i></i><span id="brandName"></span></div>
    <h1>Cinq biens à vendre à Paris</h1>
    <p class="lead">L'essentiel de chaque bien en un coup d'œil, puis photos, plans, vidéos et caractéristiques détaillées. Demandez une visite en deux clics.</p>
  </div>
</header>

<nav class="nav" aria-label="Aller à un bien"><div class="wrap" id="navLinks"></div></nav>

<main>
  <section class="overview" aria-label="Sommaire des biens">
    <div class="wrap"><ul class="cards" id="cards"></ul></div>
  </section>
  <div class="wrap" id="biens"></div>
</main>

<footer>
  <div class="wrap">
    <h2>Informations légales</h2>
    <ul id="legal"></ul>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Visionneuse">
  <div class="lb-bar"><span id="lbCap"></span><button type="button" id="lbClose">Fermer</button></div>
  <div class="lb-stage" id="lbStage"></div>
  <div class="lb-nav"><button type="button" id="lbPrev">Précédent</button><button type="button" id="lbNext">Suivant</button></div>
</div>

<script>
/* ============ DONNÉES À MODIFIER ============ */
const BROUILLON = true;            // true : affiche le bandeau et les champs à compléter
const AFFICHER_ADRESSE = false;    // false : quartier seulement ; true : adresse exacte
const CONTACT = {                  // laissez vide ce qui n'est pas encore fourni
  nom: "",                         // nom ou agence
  tel: "",                         // ex. "+33 6 00 00 00 00"
  email: "",
  whatsapp: ""                     // numéro international sans + ni espaces, ex. "33600000000"
};
/* photos: [{src, alt}] · plans: [{src, alt}] · videos: [{titre, url}] */
const BIENS = [
  { id:"bien-1", titre:"F2 refait à neuf au 4e étage", quartier:"Paris 2e", adresse:"155 rue Montmartre, 75002 Paris",
    prix:null, prixType:"", surface:44.04, surfaceNote:"loi Carrez", pieces:2, etage:"4e étage",
    photos:[], plans:[], videos:[],
    description:"Au 4e étage, F2 de 44,04 m² (loi Carrez), refait à neuf, avec cave.",
    points:[],
    carac:{ "Surface (loi Carrez)":"44,04 m²", "Étage":"4e étage", "Ascenseur":"", "Nombre de pièces":"2", "Chambres":"", "État":"Refait à neuf", "Cave":"Oui", "Exposition":"", "Chauffage":"", "DPE (classe énergie)":"", "GES (émissions)":"", "Dépenses d'énergie estimées":"", "Charges de copropriété":"", "Taxe foncière":"", "Nombre de lots de la copropriété":"" } },
  { id:"bien-2", titre:"Bien à Bonne-Nouvelle", quartier:"Paris 2e", adresse:"7 Notre-Dame de Bonne-Nouvelle, 75002 Paris",
    prix:null, prixType:"", surface:null, surfaceNote:"", pieces:null, etage:"",
    photos:[], plans:[], videos:[], description:"", points:[],
    carac:{ "Surface (loi Carrez)":"", "Étage":"", "Ascenseur":"", "Nombre de pièces":"", "Chambres":"", "État":"", "Cave":"", "Exposition":"", "Chauffage":"", "DPE (classe énergie)":"", "GES (émissions)":"", "Dépenses d'énergie estimées":"", "Charges de copropriété":"", "Taxe foncière":"", "Nombre de lots de la copropriété":"" } },
  { id:"bien-3", titre:"", quartier:"", adresse:"", prix:null, prixType:"", surface:null, surfaceNote:"", pieces:null, etage:"", photos:[], plans:[], videos:[], description:"", points:[], carac:{} },
  { id:"bien-4", titre:"", quartier:"", adresse:"", prix:null, prixType:"", surface:null, surfaceNote:"", pieces:null, etage:"", photos:[], plans:[], videos:[], description:"", points:[], carac:{} },
  { id:"bien-5", titre:"", quartier:"", adresse:"", prix:null, prixType:"", surface:null, surfaceNote:"", pieces:null, etage:"", photos:[], plans:[], videos:[], description:"", points:[], carac:{} }
];
const CARAC_PAR_DEFAUT = ["Surface (loi Carrez)","Étage","Ascenseur","Nombre de pièces","Chambres","État","Cave","Exposition","Chauffage","DPE (classe énergie)","GES (émissions)","Dépenses d'énergie estimées","Charges de copropriété","Taxe foncière","Nombre de lots de la copropriété"];
const MENTIONS = [
  "Prix : préciser s'il s'agit du prix net vendeur ou du prix honoraires inclus (FAI), et la part des honoraires à la charge de l'acheteur le cas échéant.",
  "DPE : classe énergie et classe climat (GES) de chaque bien, avec la fourchette de dépenses annuelles d'énergie, à reporter dans la fiche de chaque bien.",
  "Copropriété : nombre de lots, montant moyen annuel des charges et mention d'éventuelles procédures en cours, à reporter dans la fiche de chaque bien.",
  "Les informations de cette page sont données à titre indicatif et ne constituent pas une offre contractuelle."
];

/* ============ OUTILS ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todo = (txt="à compléter") => BROUILLON ? `<span class="todo">${esc(txt)}</span>` : "";
const nf = new Intl.NumberFormat("fr-FR");
const fmtSurface = n => n == null ? null : n.toLocaleString("fr-FR",{maximumFractionDigits:2}) + " m²";
const fmtPrix = n => n == null ? null : nf.format(n) + " €";
const val = (v, txt) => (v == null || v === "") ? todo(txt) : esc(v);
const nomBien = (b, i) => b.titre || `Bien ${i+1}`;
const lieu = b => AFFICHER_ADRESSE ? (b.adresse || b.quartier) : b.quartier;

/* ============ PAGE ============ */
$("#draft").hidden = !BROUILLON;
$("#brandName").innerHTML = CONTACT.nom ? esc(CONTACT.nom) : (BROUILLON ? todo("votre nom ou agence") : "");

$("#navLinks").innerHTML = BIENS.map((b,i)=>`<a href="#${b.id}">Bien ${i+1}</a>`).join("");

$("#cards").innerHTML = BIENS.map((b,i)=>{
  const meta = [fmtSurface(b.surface), b.pieces ? b.pieces+" pièce"+(b.pieces>1?"s":"") : null].filter(Boolean).join(" · ");
  const thumb = b.photos[0] ? `<img src="${esc(b.photos[0].src)}" alt="${esc(b.photos[0].alt||"")}" style="aspect-ratio:4/3;object-fit:cover;width:100%">` : `<div class="ph"><span>Photo à venir</span></div>`;
  return `<li><a class="card" href="#${b.id}">${thumb}<div class="body">
    <div class="q">${val(lieu(b),"quartier")}</div>
    <div class="t">${b.titre ? esc(b.titre) : todo("titre")}</div>
    <div class="m num">${meta || todo("surface · pièces")}</div>
    <div class="p num">${fmtPrix(b.prix) || todo("prix")}</div></div></a></li>`;
}).join("");

function sectionMedia(b){
  const photos = b.photos.length ? b.photos : Array.from({length:6},(_,k)=>({ph:`Photo ${k+1} à venir`}));
  const plans = b.plans.length ? b.plans : [{ph:"Plan à venir"}];
  const g = (arr,kind) => arr.map((p,k)=>`<button type="button" data-open="${b.id}|${kind}|${k}" aria-label="Agrandir ${kind==="p"?"le plan":"la photo"} ${k+1}">${p.src?`<img src="${esc(p.src)}" alt="${esc(p.alt||"")}" loading="lazy">`:`<div class="ph"><span>${esc(p.ph)}</span></div>`}</button>`).join("");
  const vids = b.videos.length
    ? b.videos.map(v=>`<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener"><b aria-hidden="true">▶</b><span>${esc(v.titre||"Voir la vidéo")}</span></a>`).join("")
    : `<div class="ph" style="aspect-ratio:16/9"><span>Vidéo à venir (visite, drone…)</span></div>`;
  return `
    <h3 class="sec-title">Photos</h3><div class="gallery">${g(photos,"g")}</div>
    <h3 class="sec-title">Plans</h3><div class="plans">${g(plans,"p")}</div>
    <h3 class="sec-title">Vidéos</h3><div class="videos">${vids}</div>`;
}

function contactBlock(b,i){
  const c = CONTACT, id = b.id;
  const tel = c.tel ? `<a class="btn primary" href="tel:${esc(c.tel.replace(/\s/g,""))}">Appeler</a>` : `<span class="btn primary" aria-disabled="true">Appeler</span>`;
  return `<section class="contact" aria-labelledby="c-${id}">
    <h3 id="c-${id}">Demander une visite</h3>
    <p class="sub">Indiquez vos disponibilités : le message est préparé pour vous.</p>
    <div class="form">
      <label>Votre nom<input id="n-${id}" autocomplete="name"></label>
      <label>Votre téléphone<input id="t-${id}" type="tel" autocomplete="tel"></label>
      <label class="full">Disponibilités souhaitées<input id="d-${id}" placeholder="ex. en semaine après 18 h, samedi matin"></label>
    </div>
    <div class="actions" style="margin-top:14px">
      ${tel}
      <a class="btn" id="m-${id}" ${c.email?"":'aria-disabled="true"'} href="#">E-mail</a>
      <a class="btn" id="w-${id}" ${c.whatsapp?"":'aria-disabled="true"'} href="#" target="_blank" rel="noopener">WhatsApp</a>
      <button type="button" class="btn ghost" data-copy="${id}">Copier le message</button>
      <span class="copied" id="cp-${id}" role="status"></span>
    </div>
    <p class="hint">${[c.tel&&("Tél. "+esc(c.tel)), c.email&&esc(c.email)].filter(Boolean).join(" · ") || todo("téléphone, e-mail ou WhatsApp à renseigner")}</p>
  </section>`;
}

$("#biens").innerHTML = BIENS.map((b,i)=>{
  const caracKeys = Object.keys(b.carac).length ? Object.keys(b.carac) : CARAC_PAR_DEFAUT;
  const ppm = (b.prix && b.surface) ? nf.format(Math.round(b.prix/b.surface)) + " € / m²" : "";
  const fact = (t,v) => `<div><dt>${t}</dt><dd class="num">${v}</dd></div>`;
  return `<article class="bien" id="${b.id}" aria-labelledby="h-${b.id}">
    <div class="bien-head">
      <div>
        <div class="kicker">Bien ${i+1} sur ${BIENS.length}</div>
        <h2 id="h-${b.id}">${b.titre ? esc(b.titre) : todo("titre accrocheur")}</h2>
        <div class="where">${val(lieu(b), AFFICHER_ADRESSE?"adresse":"quartier")}</div>
      </div>
      <div class="price num">${fmtPrix(b.prix) || todo("prix")}<small>${b.prix ? (b.prixType ? esc(b.prixType) : todo("net vendeur ou FAI ?")) : ""}${ppm?` · ${ppm}`:""}</small></div>
    </div>
    <dl class="facts">
      ${fact("Surface", fmtSurface(b.surface) ? esc(fmtSurface(b.surface)) + (b.surfaceNote?`<small style="font-family:var(--font-body);font-size:.75rem;color:var(--muted)"> ${esc(b.surfaceNote)}</small>`:"") : todo())}
      ${fact("Pièces", val(b.pieces))}
      ${fact("Étage", val(b.etage))}
    </dl>
    ${sectionMedia(b)}
    <div class="two" style="margin-top:34px">
      <div class="desc">
        <h3 class="sec-title" style="margin-top:0">Description</h3>
        ${b.description ? `<p>${esc(b.description)}</p>` : `<p>${todo("description à rédiger")}</p>`}
        ${b.points.length ? `<ul class="hl">${b.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>` : `<ul class="hl"><li>${todo("points forts")}</li></ul>`}
      </div>
      <div>
        <h3 class="sec-title" style="margin-top:0">Caractéristiques</h3>
        <dl class="spec">${caracKeys.map(k=>`<div><dt>${esc(k)}</dt><dd>${val(b.carac[k])}</dd></div>`).join("")}</dl>
      </div>
    </div>
    ${contactBlock(b,i)}
  </article>`;
}).join("");

$("#legal").innerHTML = MENTIONS.map(m=>`<li>${esc(m)}</li>`).join("");

/* ---- messages de contact ---- */
function buildMsg(id){
  const i = BIENS.findIndex(b=>b.id===id), b = BIENS[i];
  const nom = $("#n-"+id).value.trim(), tel = $("#t-"+id).value.trim(), dispo = $("#d-"+id).value.trim();
  const ou = lieu(b) ? ` (${lieu(b)})` : "";
  return `Bonjour, je souhaite visiter le bien « ${nomBien(b,i)} »${ou}.` +
    (dispo ? `\nMes disponibilités : ${dispo}.` : "") +
    (nom || tel ? `\n${[nom,tel].filter(Boolean).join(" · ")}` : "") + "\nMerci.";
}
function refreshLinks(id){
  const msg = buildMsg(id), b = BIENS.find(x=>x.id===id);
  const m = $("#m-"+id), w = $("#w-"+id);
  if (CONTACT.email) m.href = `mailto:${CONTACT.email}?subject=${encodeURIComponent("Demande de visite : "+nomBien(b,BIENS.indexOf(b)))}&body=${encodeURIComponent(msg)}`;
  if (CONTACT.whatsapp) w.href = `https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(msg)}`;
}
BIENS.forEach(b=>{
  ["n-","t-","d-"].forEach(p=>$("#"+p+b.id).addEventListener("input",()=>refreshLinks(b.id)));
  refreshLinks(b.id);
  ["m-","w-"].forEach(p=>$("#"+p+b.id).addEventListener("click",e=>{ if(e.currentTarget.getAttribute("aria-disabled")==="true") e.preventDefault(); }));
});
document.addEventListener("click", async e=>{
  const c = e.target.closest("[data-copy]");
  if(!c) return;
  const id = c.dataset.copy, out = $("#cp-"+id);
  try{ await navigator.clipboard.writeText(buildMsg(id)); out.textContent = "Message copié"; }
  catch(_){ out.textContent = "Copie impossible : sélectionnez le texte manuellement."; }
  setTimeout(()=>out.textContent="",3000);
});

/* ---- visionneuse ---- */
const lb = $("#lb"), stage = $("#lbStage"), cap = $("#lbCap");
let items = [], cur = 0, opener = null;
function sets(id,kind){
  const b = BIENS.find(x=>x.id===id);
  const arr = kind==="p" ? (b.plans.length?b.plans:[{ph:"Plan à venir"}]) : (b.photos.length?b.photos:Array.from({length:6},(_,k)=>({ph:`Photo ${k+1} à venir`})));
  return arr;
}
function show(){
  const p = items[cur];
  stage.innerHTML = p.src ? `<img src="${esc(p.src)}" alt="${esc(p.alt||"")}">` : `<div class="ph"><span>${esc(p.ph)}</span></div>`;
  cap.textContent = `${cur+1} / ${items.length}`;
}
function openLb(btn){
  const [id,kind,k] = btn.dataset.open.split("|");
  items = sets(id,kind); cur = +k; opener = btn;
  lb.classList.add("open"); show(); $("#lbClose").focus();
  document.body.style.overflow = "hidden";
}
function closeLb(){ lb.classList.remove("open"); document.body.style.overflow=""; if(opener) opener.focus(); }
const step = d => { cur = (cur+d+items.length)%items.length; show(); };
document.addEventListener("click", e=>{ const b = e.target.closest("[data-open]"); if(b) openLb(b); });
$("#lbClose").onclick = closeLb; $("#lbPrev").onclick = ()=>step(-1); $("#lbNext").onclick = ()=>step(1);
lb.addEventListener("click", e=>{ if(e.target===lb || e.target===stage) closeLb(); });
document.addEventListener("keydown", e=>{
  if(!lb.classList.contains("open")) return;
  if(e.key==="Escape") closeLb();
  if(e.key==="ArrowLeft") step(-1);
  if(e.key==="ArrowRight") step(1);
});
</script>
