<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALCIONE · EPONA — Quatorze adresses parisiennes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DIRECTION ARTISTIQUE
   Fond blanc cassé · texte anthracite · un seul accent champagne.
   Teintes de statut sourdes. Filets 1px, aucune ombre portée.
   ============================================================ */
:root{
  --paper:#FAF8F5;
  --paper-2:#F4F1EC;
  --ink:#1C1B19;
  --ink-60:rgba(28,27,25,.60);
  --ink-40:rgba(28,27,25,.40);
  --ink-22:rgba(28,27,25,.22);
  --rule:rgba(28,27,25,.14);
  --rule-soft:rgba(28,27,25,.08);
  --gold:#A8905F;

  --s-vente:#A8905F;      /* champagne  — en cours de vente */
  --s-travaux:#7D6A55;    /* bronze     — en travaux */
  --s-vendu:#B3B0A9;      /* gris perle — vendu */
  --s-acq:#2E3A4A;        /* bleu nuit  — en cours d'acquisition */

  --ease:cubic-bezier(.22,.61,.36,1);
  --t:460ms;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Jost',system-ui,sans-serif;
  font-weight:300;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

h1,h2,h3,.serif{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:300;
  letter-spacing:.005em;
}

/* Petites capitales très espacées : labels, statuts, liens */
.sc{
  font-family:'Jost',sans-serif;
  font-weight:400;
  font-size:10.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
}

.rule{height:1px;background:var(--rule);border:0;margin:0}

/* ===================== EN-TÊTE ===================== */
.masthead{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:26px 32px 20px;
  display:flex;align-items:baseline;gap:22px;
  background:linear-gradient(to bottom,var(--paper) 55%,rgba(250,248,245,0));
  pointer-events:none;
}
.masthead > *{pointer-events:auto}
.wordmark{
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:12.5px;letter-spacing:.42em;text-transform:uppercase;
  white-space:nowrap;
}
.wordmark .sep{color:var(--ink-40);margin:0 .5em}
.tagline{
  font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;
  font-size:15px;color:var(--ink-60);
  margin-left:auto;white-space:nowrap;
}

/* ===================== VUE CARTE ===================== */
#vue-carte{position:fixed;inset:0;overflow:hidden}
#plan{position:absolute;inset:0;touch-action:none;cursor:grab}
#plan.dragging{cursor:grabbing}
#plan svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.geo-ville{fill:none;stroke:var(--ink);stroke-width:.75;opacity:.11;stroke-linejoin:round}
.geo-seine{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:.16;stroke-linecap:round}
.geo-limite{
  fill:none;stroke:var(--ink);stroke-width:.7;opacity:.14;
  stroke-dasharray:1.5 4;stroke-linecap:round;stroke-linejoin:round;
}
.geo-arr{
  font-family:'Jost',sans-serif;font-weight:400;font-size:9.5px;
  letter-spacing:.14em;fill:var(--ink);opacity:.3;
  text-anchor:middle;user-select:none;
}

/* --- pastilles --- */
.pin{
  position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;
  border:0;display:grid;place-items:center;z-index:5;
}
.pin .dot{
  width:11px;height:11px;border-radius:50%;
  background:var(--c);
  box-shadow:0 0 0 1px var(--paper), 0 0 0 1.9px var(--c-ring);
  transition:transform var(--t) var(--ease);
}
.pin[data-statut="vendu"] .dot{width:9px;height:9px}
.pin:hover .dot,.pin.actif .dot{transform:scale(1.5)}
.pin .halo{
  position:absolute;width:11px;height:11px;border-radius:50%;
  border:1px solid var(--c);opacity:0;pointer-events:none;
}
.pin[data-statut="vente"] .halo{animation:respire 3600ms var(--ease) infinite}
@keyframes respire{
  0%{transform:scale(1);opacity:.5}
  70%{transform:scale(3.4);opacity:0}
  100%{transform:scale(3.4);opacity:0}
}
.pin.masque{opacity:.12;pointer-events:none;transition:opacity var(--t) var(--ease)}
.pin{transition:opacity var(--t) var(--ease)}

/* --- carte flottante --- */
#survol{
  position:fixed;z-index:30;width:272px;
  background:rgba(250,248,245,.82);
  backdrop-filter:blur(18px) saturate(1.1);
  -webkit-backdrop-filter:blur(18px) saturate(1.1);
  border:1px solid var(--rule);
  opacity:0;transform:translateY(5px);
  transition:opacity 320ms var(--ease),transform 320ms var(--ease);
  pointer-events:none;
}
#survol.on{opacity:1;transform:translateY(0)}
#survol .vignette{aspect-ratio:4/3;background:var(--paper-2);overflow:hidden}
#survol .vignette img{width:100%;height:100%;object-fit:cover}
#survol .corps{padding:14px 16px 16px}
#survol .statut{display:block;margin-bottom:8px}
#survol .adr{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.25;margin:0 0 2px}
#survol .arr{font-size:12.5px;color:var(--ink-60);letter-spacing:.04em}
#survol .meta{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule-soft);font-size:12.5px;color:var(--ink-60);display:flex;gap:14px;flex-wrap:wrap}
#survol .prix{color:var(--ink)}
#survol .evt{margin-top:9px;font-size:11.5px;color:var(--gold);letter-spacing:.03em}

/* --- filtres --- */
#filtres{
  position:fixed;z-index:35;left:32px;bottom:30px;
  display:flex;flex-direction:column;gap:9px;align-items:flex-start;
}
#filtres .f{
  display:flex;align-items:baseline;gap:9px;
  color:var(--ink-60);padding-bottom:3px;
  border-bottom:1px solid transparent;
  transition:color var(--t) var(--ease),border-color var(--t) var(--ease);
}
#filtres .f:hover{color:var(--ink)}
#filtres .f.on{color:var(--ink);border-bottom-color:var(--gold)}
#filtres .f .n{font-size:10px;letter-spacing:.1em;color:var(--ink-40);font-variant-numeric:tabular-nums}
#filtres .f .tin{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}

#zoomhint{
  position:fixed;z-index:35;right:32px;bottom:30px;
  color:var(--ink-40);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
}

/* ===================== FICHE ===================== */
#vue-fiche{
  position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;
  background:var(--paper);
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity var(--t) var(--ease),transform var(--t) var(--ease),visibility var(--t);
}
#vue-fiche.on{opacity:1;visibility:visible;transform:none}
body.fiche #vue-carte{opacity:.25;transition:opacity var(--t) var(--ease)}
#vue-carte{transition:opacity var(--t) var(--ease)}

.hero{position:relative;height:78vh;min-height:420px;overflow:hidden;background:var(--paper-2)}
.hero img{width:100%;height:100%;object-fit:cover;animation:kenburns 26s var(--ease) both}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero .retour{
  position:absolute;top:26px;left:32px;z-index:3;
  color:var(--ink);background:rgba(250,248,245,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:9px 15px;border:1px solid var(--rule);
}
.hero .retour:hover{color:var(--gold)}

/* plaque « visuel à venir » */
.plaque{
  width:100%;height:100%;display:grid;place-items:center;
  background:
    linear-gradient(135deg,rgba(28,27,25,.012) 0 50%,transparent 50%),
    var(--paper-2);
  border:1px solid var(--rule-soft);
}
.plaque span{color:var(--ink-40);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase}

.wrap{max-width:1180px;margin:0 auto;padding:0 32px}

.titre-bloc{padding:68px 0 0;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}
.titre-bloc .statut-l{display:block;color:var(--c);margin-bottom:14px}
.titre-bloc h1{font-size:clamp(34px,5.2vw,60px);line-height:1.04;margin:0}
.titre-bloc .lieu{margin-top:10px;color:var(--ink-60);font-size:15px;letter-spacing:.03em}
.titre-bloc .prix-g{
  font-family:'Cormorant Garamond',serif;font-size:clamp(22px,2.6vw,30px);
  white-space:nowrap;text-align:right;
}
.titre-bloc .prix-g small{display:block;font-family:'Jost';font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-40);margin-bottom:5px}

.evenement{
  margin-top:34px;padding:16px 0;
  border-top:1px solid var(--gold);border-bottom:1px solid var(--rule-soft);
  display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;
}
.evenement .lab{color:var(--gold)}
.evenement .txt{font-family:'Cormorant Garamond',serif;font-size:19px}

.chapeau{
  margin:44px 0 0;max-width:56ch;
  font-family:'Cormorant Garamond',serif;font-size:clamp(19px,2.1vw,23px);
  line-height:1.55;color:var(--ink);font-weight:300;
}

/* galerie : grandes images alternées, beaucoup de blanc */
.galerie{margin:76px 0 0}
.galerie figure{margin:0 0 76px}
.galerie .g-full{width:100%}
.galerie .g-full img{width:100%;height:auto}
.galerie .g-full .plaque{aspect-ratio:3/2;width:100%}
.galerie .g-droite,.galerie .g-gauche,
.galerie .g-p-droite,.galerie .g-p-gauche{display:grid;grid-template-columns:repeat(12,1fr);align-items:center;gap:32px}
.galerie .g-droite > div{grid-column:4 / span 9}
.galerie .g-gauche > div{grid-column:1 / span 9}
.galerie .g-p-droite > div{grid-column:7 / span 5}
.galerie .g-p-gauche > div{grid-column:2 / span 5}
.galerie .g-droite img,.galerie .g-gauche img,
.galerie .g-p-droite img,.galerie .g-p-gauche img{width:100%;height:auto}
.galerie .g-droite .plaque,.galerie .g-gauche .plaque{aspect-ratio:4/3;width:100%}
.galerie .g-p-droite .plaque,.galerie .g-p-gauche .plaque{aspect-ratio:3/4;width:100%}
.galerie figcaption{margin-top:12px;color:var(--ink-40);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.galerie .plan-img{border:1px solid var(--rule-soft);padding:20px;background:#fff}

/* fiche technique */
.specs{margin:12px 0 0;border-top:1px solid var(--rule)}
.specs .l{
  display:grid;grid-template-columns:200px 1fr;gap:24px;
  padding:16px 0;border-bottom:1px solid var(--rule-soft);
}
.specs .l dt{color:var(--ink-40);font-family:'Jost';font-weight:400;font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding-top:4px}
.specs .l dd{margin:0;font-family:'Cormorant Garamond',serif;font-size:21px}

/* frise d'avancement */
.frise{margin:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border-top:1px solid var(--rule)}
.frise .et{padding:18px 18px 18px 0;border-top:2px solid var(--rule-soft);margin-top:-1px;position:relative}
.frise .et.fait{border-top-color:var(--s-travaux)}
.frise .et.encours{border-top-color:var(--gold)}
.frise .et .n{display:block;color:var(--ink-40);margin-bottom:6px}
.frise .et.encours .n{color:var(--gold)}
.frise .et .q{font-family:'Cormorant Garamond',serif;font-size:19px}
.frise .et.avenir .q{color:var(--ink-40)}

.section{margin:88px 0 0}
.section > .sc{display:block;color:var(--ink-40);margin-bottom:18px}

/* mini-plan */
.miniplan{position:relative;height:300px;background:var(--paper-2);border:1px solid var(--rule-soft);overflow:hidden}
.miniplan svg{position:absolute;inset:0;width:100%;height:100%}
.miniplan .mp-dot{fill:var(--c)}
.miniplan .mp-ring{fill:none;stroke:var(--c);opacity:.45}

/* pied + contact */
.pied{margin:96px 0 0;padding:52px 0 72px;border-top:1px solid var(--rule)}
.pied .deux{display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center}
.contact-b{
  display:inline-flex;align-items:center;gap:12px;
  padding:16px 26px;border:1px solid var(--ink);
  transition:background var(--t) var(--ease),color var(--t) var(--ease),border-color var(--t) var(--ease);
}
.contact-b:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.coord{color:var(--ink-60);font-size:13.5px;line-height:1.9}
.coord a:hover{color:var(--gold)}
.retour-bas{display:inline-block;margin-top:30px;color:var(--ink-60);border-bottom:1px solid var(--rule)}
.retour-bas:hover{color:var(--gold);border-bottom-color:var(--gold)}

.mentions{margin-top:44px;color:var(--ink-40);font-size:10.5px;line-height:1.85;letter-spacing:.02em;max-width:78ch}

/* ===================== MOBILE ===================== */
@media (max-width:860px){
  .masthead{padding:18px 20px 14px;flex-wrap:wrap;gap:6px}
  .wordmark{font-size:11px;letter-spacing:.34em}
  .tagline{margin-left:0;font-size:13.5px;white-space:normal}
  #filtres{left:20px;right:20px;bottom:20px;gap:7px}
  #zoomhint{display:none}
  #survol{
    left:14px!important;right:14px!important;top:auto!important;
    bottom:calc(env(safe-area-inset-bottom,0px) + 128px)!important;
    width:auto;
  }
  .wrap{padding:0 20px}
  .hero{height:62vh;min-height:320px}
  .hero .retour{top:18px;left:20px}
  .titre-bloc{grid-template-columns:1fr;padding-top:42px;gap:18px;align-items:start}
  .titre-bloc .prix-g{text-align:left}
  .galerie{margin-top:52px}
  .galerie figure{margin-bottom:52px}
  .galerie .g-droite > div,.galerie .g-gauche > div,
  .galerie .g-p-droite > div,.galerie .g-p-gauche > div{grid-column:1 / -1}
  .specs .l{grid-template-columns:1fr;gap:4px;padding:14px 0}
  .frise{grid-auto-flow:row;grid-auto-columns:auto}
  .frise .et{padding:14px 0;border-top-width:1px}
  .frise .et{border-left:2px solid var(--rule-soft);padding-left:16px;border-top:0;margin-top:0}
  .frise .et.fait{border-left-color:var(--s-travaux)}
  .frise .et.encours{border-left-color:var(--gold)}
  .section{margin-top:60px}
  .pied .deux{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:1ms!important}
}
</style>
</head>

<script>
'use strict';
/* =========================================================
   1 · PROJECTION  (Web Mercator, échelle en pixels)
   ========================================================= */
const R = 128/Math.PI;
const merc = (lat,lon)=>({
  x: R*(lon*Math.PI/180),
  y: R*Math.log(Math.tan(Math.PI/4 + (lat*Math.PI/180)/2))
});

const CENTRE = merc(48.8610,2.3420);   // cœur de Paris
const vue = { z: 1, cx: CENTRE.x, cy: CENTRE.y, zMin:.72, zMax:3.4 };

let W=0,H=0,ECH=1;
function mesurer(){
  const r = document.getElementById('plan').getBoundingClientRect();
  W=r.width; H=r.height;
  // échelle de base : Paris tient dans le cadre avec une marge généreuse
  const a=merc(48.812,2.246), b=merc(48.906,2.424);
  ECH = Math.min(W/(b.x-a.x), H/(b.y-a.y)) * .80;
}
const proj = (lat,lon)=>{
  const p=merc(lat,lon);
  return {
    x: W/2 + (p.x-vue.cx)*ECH*vue.z,
    y: H/2 - (p.y-vue.cy)*ECH*vue.z
  };
};

/* =========================================================
   2 · HABILLAGE GÉOGRAPHIQUE
   ========================================================= */
const COUL = {
  vente:  {c:'var(--s-vente)',   lab:'En cours de vente'},
  travaux:{c:'var(--s-travaux)', lab:'En travaux'},
  vendu:  {c:'var(--s-vendu)',   lab:'Vendu'},
  acquisition:{c:'var(--s-acq)', lab:"En cours d'acquisition"}
};
const d = pts => pts.map((p,i)=>{const q=proj(p[0],p[1]);return (i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1);}).join(' ');

const SVGNS='http://www.w3.org/2000/svg';
const elArrs = document.getElementById('g-arrs');
ARRS.forEach(a=>{
  const t=document.createElementNS(SVGNS,'text');
  t.setAttribute('class','geo-arr'); t.textContent=a[0];
  t.dataset.lat=a[1]; t.dataset.lon=a[2];
  elArrs.appendChild(t);
});
const elLim = document.getElementById('g-limites');
LIMITES.forEach(()=>{
  const p=document.createElementNS(SVGNS,'path');
  p.setAttribute('class','geo-limite');
  elLim.appendChild(p);
});

function dessinerGeo(){
  document.getElementById('g-ville').setAttribute('d', d(VILLE)+' Z');
  document.getElementById('g-seine').setAttribute('d', d(SEINE));
  const paths=elLim.querySelectorAll('path');
  LIMITES.forEach((l,i)=>paths[i].setAttribute('d', d(l)));
  elArrs.querySelectorAll('text').forEach(t=>{
    const p=proj(+t.dataset.lat,+t.dataset.lon);
    t.setAttribute('x',p.x.toFixed(1)); t.setAttribute('y',p.y.toFixed(1));
  });
}

/* =========================================================
   3 · PASTILLES
   ========================================================= */
const plan = document.getElementById('plan');
const pins = PROJETS.map(p=>{
  const b=document.createElement('button');
  b.className='pin'; b.dataset.statut=p.statut; b.dataset.slug=p.slug;
  b.style.setProperty('--c',COUL[p.statut].c);
  b.style.setProperty('--c-ring',COUL[p.statut].c);
  b.setAttribute('aria-label',p.titre+' — '+COUL[p.statut].lab);
  b.innerHTML='<span class="halo"></span><span class="dot"></span>';
  plan.appendChild(b);
  return {p,el:b};
});

/* léger décalage quand deux pastilles se chevauchent */
function placerPins(){
  const pos = pins.map(({p})=>proj(p.ll[0],p.ll[1]));
  for(let i=0;i<pos.length;i++){
    for(let j=i+1;j<pos.length;j++){
      const dx=pos[j].x-pos[i].x, dy=pos[j].y-pos[i].y;
      const dist=Math.hypot(dx,dy);
      if(dist<19 && dist>0){
        const k=(19-dist)/2/dist;
        pos[i].x-=dx*k; pos[i].y-=dy*k;
        pos[j].x+=dx*k; pos[j].y+=dy*k;
      }
    }
  }
  pins.forEach((o,i)=>{
    o.el.style.transform='translate('+pos[i].x.toFixed(1)+'px,'+pos[i].y.toFixed(1)+'px)';
    o.xy=pos[i];
  });
}

/* =========================================================
   4 · FILTRES
   ========================================================= */
let filtre='tout';
const ORDRE=['vente','travaux','vendu','acquisition'];
const navF=document.getElementById('filtres');
function construireFiltres(){
  const n=s=>PROJETS.filter(p=>p.statut===s).length;
  let h='<button class="f sc on" data-f="tout">Tout <span class="n">'+PROJETS.length+'</span></button>';
  ORDRE.forEach(s=>{ if(!n(s)) return;
    h+='<button class="f sc" data-f="'+s+'" style="--c:'+COUL[s].c+'">'+
       '<span class="tin"></span>'+COUL[s].lab+' <span class="n">'+n(s)+'</span></button>';
  });
  navF.innerHTML=h;
  navF.querySelectorAll('.f').forEach(b=>b.addEventListener('click',()=>{
    filtre=b.dataset.f;
    navF.querySelectorAll('.f').forEach(x=>x.classList.toggle('on',x===b));
    pins.forEach(o=>o.el.classList.toggle('masque', filtre!=='tout' && o.p.statut!==filtre));
    cacherSurvol();
  }));
}

/* =========================================================
   5 · CARTE FLOTTANTE
   ========================================================= */
const survol=document.getElementById('survol');
let survolTimer=null;
function vignette(p){
  return p.photos.length
    ? '<div class="vignette"><img src="'+p.photos[0].src+'" alt="" loading="lazy"></div>'
    : '<div class="vignette"><div class="plaque"><span>Visuel à venir</span></div></div>';
}
function montrerSurvol(o){
  const p=o.p;
  const bits=[p.surface];
  if(p.pieces) bits.push(p.pieces);
  survol.innerHTML = vignette(p)+
    '<div class="corps">'+
      '<span class="statut sc" style="color:'+COUL[p.statut].c+'">'+COUL[p.statut].lab+'</span>'+
      '<p class="adr">'+p.titre+'</p>'+
      '<p class="arr">'+p.quartier+' — '+p.arr+'</p>'+
      '<div class="meta"><span>'+bits.join(' · ')+'</span>'+
        (p.prix?'<span class="prix">'+p.prix+'</span>':'')+'</div>'+
      (p.evenement?'<p class="evt">'+p.evenement.lab+' — '+p.evenement.txt+'</p>':'')+
    '</div>';
  const r=plan.getBoundingClientRect();
  let x=r.left+o.xy.x+22, y=r.top+o.xy.y-70;
  const wC=272, hC=survol.offsetHeight||300;
  if(x+wC>window.innerWidth-16) x=r.left+o.xy.x-wC-22;
  y=Math.max(84,Math.min(y,window.innerHeight-hC-24));
  survol.style.left=x+'px'; survol.style.top=y+'px';
  survol.classList.add('on');
  pins.forEach(q=>q.el.classList.toggle('actif',q===o));
}
function cacherSurvol(){
  survol.classList.remove('on');
  pins.forEach(q=>q.el.classList.remove('actif'));
}
const finPointeur = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
pins.forEach(o=>{
  if(finPointeur){
    o.el.addEventListener('mouseenter',()=>{clearTimeout(survolTimer);montrerSurvol(o)});
    o.el.addEventListener('mouseleave',()=>{survolTimer=setTimeout(cacherSurvol,140)});
    o.el.addEventListener('click',()=>allerFiche(o.p.slug));
  }else{
    o.el.addEventListener('click',e=>{
      e.stopPropagation();
      if(o.el.classList.contains('actif')) allerFiche(o.p.slug);
      else montrerSurvol(o);
    });
  }
});
survol.addEventListener('mouseenter',()=>clearTimeout(survolTimer));
survol.addEventListener('mouseleave',cacherSurvol);
survol.addEventListener('click',()=>{
  const a=pins.find(q=>q.el.classList.contains('actif'));
  if(a) allerFiche(a.p.slug);
});
plan.addEventListener('click',e=>{ if(e.target===plan||e.target.closest('#geo')) cacherSurvol(); });

/* =========================================================
   6 · DÉPLACEMENT / ZOOM
   ========================================================= */
function redessiner(){ dessinerGeo(); placerPins(); }
function clampVue(){
  vue.z=Math.max(vue.zMin,Math.min(vue.zMax,vue.z));
  const a=merc(48.800,2.230), b=merc(48.918,2.440);
  vue.cx=Math.max(a.x,Math.min(b.x,vue.cx));
  vue.cy=Math.max(a.y,Math.min(b.y,vue.cy));
}
let drag=null;
plan.addEventListener('pointerdown',e=>{
  if(e.target.closest('.pin')) return;
  drag={x:e.clientX,y:e.clientY,cx:vue.cx,cy:vue.cy};
  plan.classList.add('dragging');
  plan.setPointerCapture(e.pointerId);
});
plan.addEventListener('pointermove',e=>{
  if(!drag) return;
  vue.cx = drag.cx - (e.clientX-drag.x)/(ECH*vue.z);
  vue.cy = drag.cy + (e.clientY-drag.y)/(ECH*vue.z);
  clampVue(); redessiner();
});
const finDrag=()=>{drag=null;plan.classList.remove('dragging')};
plan.addEventListener('pointerup',finDrag);
plan.addEventListener('pointercancel',finDrag);
plan.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=plan.getBoundingClientRect();
  const sx=e.clientX-r.left-W/2, sy=e.clientY-r.top-H/2;
  const avant=vue.z;
  vue.z *= Math.exp(-e.deltaY*0.0016);
  clampVue();
  // le point sous le curseur reste sous le curseur
  const k=1/(ECH*avant)-1/(ECH*vue.z);
  vue.cx += sx*k; vue.cy -= sy*k;
  clampVue(); redessiner(); cacherSurvol();
},{passive:false});

/* pincement */
let pinch=null;
plan.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    const [a,b]=e.touches;
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:vue.z};
    drag=null;
  }
},{passive:true});
plan.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){
    e.preventDefault();
    const [a,b]=e.touches;
    const dd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    vue.z=pinch.z*(dd/pinch.d);
    clampVue(); redessiner();
  }
},{passive:false});
plan.addEventListener('touchend',()=>{pinch=null},{passive:true});

/* =========================================================
   7 · FICHE
   ========================================================= */
const fiche=document.getElementById('vue-fiche');
const img = (ph,cls)=> ph
  ? '<img'+(ph.plan?' class="plan-img"':'')+' src="'+ph.src+'" alt="'+(ph.lg||'')+'" loading="lazy">'
  : '<div class="plaque"><span>Visuel à venir</span></div>';

function figure(p,i,place){
  const ph=p.photos[i];
  return '<figure><div class="'+place+'"><div>'+img(ph)+
    (ph&&ph.lg?'<figcaption>'+ph.lg+'</figcaption>':'')+'</div></div></figure>';
}

function frise(p){
  const etapes=[
    {n:'01',q:'Acquisition',e:'fait'},
    {n:'02',q:'Études et autorisations',e:'fait'},
    {n:'03',q:'Travaux',e:'encours'},
    {n:'04',q:p.livraison?('Livraison — '+p.livraison):'Livraison',e:'avenir'}
  ];
  return '<div class="frise">'+etapes.map(e=>
    '<div class="et '+e.e+'"><span class="n sc">'+e.n+'</span><span class="q">'+e.q+'</span></div>'
  ).join('')+'</div>';
}

function miniplan(p){
  const sauv={...vue};
  const c=merc(p.ll[0],p.ll[1]);
  vue.cx=c.x; vue.cy=c.y; vue.z=2.6;
  const wS=W,hS=H; W=600;H=300;
  const path=d(SEINE), ring=d(VILLE);
  const lim=LIMITES.map(l=>'<path class="geo-limite" d="'+d(l)+'"></path>').join('');
  const q=proj(p.ll[0],p.ll[1]);
  W=wS;H=hS; Object.assign(vue,sauv);
  return '<div class="miniplan" style="--c:'+COUL[p.statut].c+'">'+
    '<svg viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice">'+
      '<path class="geo-ville" d="'+ring+' Z"></path>'+
      lim+
      '<path class="geo-seine" d="'+path+'"></path>'+
      '<circle class="mp-ring" cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="13"></circle>'+
      '<circle class="mp-dot" cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="4.5"></circle>'+
    '</svg></div>';
}

function ligne(dt,dd){ return dd?'<div class="l"><dt>'+dt+'</dt><dd>'+dd+'</dd></div>':''; }

function rendreFiche(p){
  const C=COUL[p.statut];
  const nb=p.photos.length;
  let gal='', cote=true;
  if(nb===0){
    gal=figure(p,1,'g-full');
  }else{
    for(let i=1;i<nb;i++){
      const ph=p.photos[i];
      if(ph.portrait){
        gal+=figure(p,i, cote?'g-p-droite':'g-p-gauche'); cote=!cote;
      }else if(ph.petite){            // définition modeste : colonne décalée
        gal+=figure(p,i, cote?'g-droite':'g-gauche'); cote=!cote;
      }else{
        gal+=figure(p,i,'g-full');
      }
    }
  }

  fiche.innerHTML=
  '<div class="hero" style="--c:'+C.c+'">'+
    '<a class="retour sc" href="#carte">← Retour à la carte</a>'+
    img(p.photos[0])+
  '</div>'+
  '<div class="wrap" style="--c:'+C.c+'">'+
    '<div class="titre-bloc">'+
      '<div>'+
        '<span class="statut-l sc">'+C.lab+'</span>'+
        '<h1>'+p.titre+'</h1>'+
        '<p class="lieu">'+p.quartier+' — '+p.arr+'</p>'+
      '</div>'+
      (p.prix?'<div class="prix-g"><small>'+(p.prix==='Prix sur demande'?'Prix':'Prix de vente')+'</small>'+p.prix+'</div>':'')+
    '</div>'+

    (p.evenement?'<div class="evenement"><span class="lab sc">'+p.evenement.lab+'</span>'+
       '<span class="txt">'+p.evenement.txt+'</span></div>':'')+

    '<p class="chapeau">'+p.chapeau+'</p>'+

    '<div class="galerie">'+gal+'</div>'+

    '<section class="section"><span class="sc">Fiche technique</span>'+
      '<dl class="specs">'+
        ligne('Surface', p.surface ? p.surface+(p.surfaceNote?' <span style="font-family:Jost;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40)"> — '+p.surfaceNote+'</span>':'') : '')+
        ligne('Pièces', p.pieces)+
        ligne('Étage', p.etage)+
        ligne('Annexes', p.annexes)+
        ligne('Année de construction', p.annee)+
        ligne('Diagnostic de performance énergétique', p.dpe)+
      '</dl>'+
    '</section>'+

    (p.statut==='travaux'
      ? '<section class="section"><span class="sc">Avancement</span>'+frise(p)+'</section>'
      : '')+

    '<section class="section"><span class="sc">Situation</span>'+miniplan(p)+
      '<p class="coord" style="margin-top:14px">'+p.adresse+'</p>'+
    '</section>'+

    '<footer class="pied">'+
      '<div class="deux">'+
        '<div>'+
          '<span class="sc" style="color:var(--ink-40);display:block;margin-bottom:12px">Renseignements et visites</span>'+
          '<p class="coord">'+CONTACT.nom+'<br>'+
            '<a href="mailto:'+CONTACT.email+'">'+CONTACT.email+'</a><br>'+
            '<a href="tel:'+CONTACT.tel.replace(/\s/g,'')+'">'+CONTACT.tel+'</a></p>'+
        '</div>'+
        '<a class="contact-b sc" href="mailto:'+CONTACT.email+'?subject='+encodeURIComponent('Demande de renseignements — '+p.titre)+'">Nous écrire</a>'+
      '</div>'+
      '<a class="retour-bas sc" href="#carte">← Retour à la carte</a>'+
      '<p class="mentions">'+
        'Document d\'information non contractuel. Surfaces indiquées au sens de la loi Carrez, '+
        'sous réserve des mesurages définitifs figurant aux actes. Les photographies sont indicatives ; '+
        'certaines comportent une mise en scène virtuelle du mobilier, qui ne fait pas partie du bien vendu. '+
        'Les prix mentionnés s\'entendent hors frais d\'acte. '+
        'Aucun des éléments présentés ne constitue une offre de vente ni un engagement contractuel. '+
        '© '+new Date().getFullYear()+' ALCIONE IMMOBILIER · EPONA.'+
      '</p>'+
    '</footer>'+
  '</div>';
}

/* =========================================================
   8 · ROUTAGE (#carte et #bien-<slug> — ancres simples)
   ========================================================= */
function allerFiche(slug){ location.hash='bien-'+slug; }
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  const p=h.startsWith('bien-') ? PROJETS.find(x=>x.slug===h.slice(5)) : null;
  if(p){
    rendreFiche(p);
    document.body.classList.add('fiche');
    fiche.classList.add('on');
    fiche.scrollTop=0;
    document.title=p.titre+' — ALCIONE · EPONA';
  }else{
    fiche.classList.remove('on');
    document.body.classList.remove('fiche');
    cacherSurvol();
    document.title='ALCIONE · EPONA — Quatorze adresses parisiennes';
    setTimeout(()=>{ if(!document.body.classList.contains('fiche')) fiche.innerHTML=''; },520);
  }
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(document.body.classList.contains('fiche')) location.hash='carte'; else cacherSurvol(); }
});

/* =========================================================
   9 · DÉMARRAGE
   ========================================================= */
function init(){ mesurer(); clampVue(); redessiner(); }
let rt=null;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{init();cacherSurvol()},140)});
construireFiltres();
init();
route();
</script>
